# Pool connections to the API instead of opening a new TCP connection per
# request. HLS is many small requests per viewer, so the handshake per segment
# was pure added latency.
upstream api_backend {
    server api:8787;
    keepalive 64;
    keepalive_timeout 120s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long ?url=... query strings for /proxy/hls
    large_client_header_buffers 4 32k;

    gzip on;
    # Playlists are added here for the case where the API serves them uncompressed;
    # nginx skips anything already carrying Content-Encoding.
    # Do NOT add video/mp2t or the segment types: .ts payloads are already-encoded
    # H.264/AAC, where gzip measured a 1.9% saving for ~50 ms of CPU per segment,
    # and buffering them for compression would undo the streaming pass-through.
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/vnd.apple.mpegurl application/xml;

    # Static logos: do not fall through to SPA (try_files … /index.html), or missing files
    # return the React app and Router shows a fake "404" for /logo/... URLs.
    location ^~ /logo/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Use $http_host so the port is preserved (e.g. localhost:8080). $host omits the port and
    # breaks FastAPI's request.url / HLS playlist rewrite URLs (segments would hit :80).
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /proxy/ {
        proxy_pass http://api_backend/proxy/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Segments must stream through rather than be buffered whole.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_read_timeout 120s;
    }

    location = /admin {
        proxy_pass http://api_backend/admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
